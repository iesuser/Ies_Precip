worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    upstream flask_app {
        server flask:5000;
    }

    server {
        listen 80;
        server_name iesdata.iliauni.edu.ge;

        location / {
            include uwsgi_params;
            uwsgi_pass flask_app;
        }
    }
}